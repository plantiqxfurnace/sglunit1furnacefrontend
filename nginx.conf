server {
    listen 87;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── API proxy ─────────────────────────────────────────────────────────────
    # All /api/* requests are forwarded to the backend container.
    # The browser sees a single origin — no CORS issues.
    location /api/ {
        proxy_pass         http://backend:4008;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Socket.IO proxy (WebSocket + long-poll) ───────────────────────────────
    location /socket.io/ {
        proxy_pass         http://backend:4008;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Keep the WS connection alive for long-lived streams
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── React Router — SPA fallback ───────────────────────────────────────────
    # Serve index.html for any path that doesn't match a static file,
    # so client-side routes (e.g. /furnace/FUR_01) work on hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching ──────────────────────────────────────────────────
    # Vite fingerprints all JS/CSS filenames, so these can be cached forever.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/javascript image/svg+xml;
    gzip_min_length 1024;
}
